name: agentsprint
services:
  agentsprint:
    build: .
    image: agentsprint:latest
    container_name: agentsprint
    restart: unless-stopped
    ports:
      - "4310:4310"
    volumes:
      # Point /board at a folder containing one or more repos with a
      # `.agentboard/` directory — each one is discovered as a separate
      # project. Replace ./your-project with the path to your project.
      - ./your-project:/board
    command: serve /board --host 0.0.0.0 --no-open --mcp
