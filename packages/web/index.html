<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgentSprint</title>
    <script>
      ;(function () {
        var stored = null
        try {
          stored = localStorage.getItem('agentsprint-theme')
        } catch (e) {}
        var wantLight = stored
          ? stored === 'light'
          : window.matchMedia('(prefers-color-scheme: light)').matches
        document.documentElement.classList.toggle('light', wantLight)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
